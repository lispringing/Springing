<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Springing 后台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --accent: #e94560;
    --accent2: #53d8fb;
    --text: #eaeaea;
    --text2: #a0a0b0;
    --border: #2a2a4a;
    --success: #4ade80;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== 登录页 ===== */
  .login-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .login-box h1 {
    font-size: 22px; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-box p { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
  .login-box input {
    width: 100%; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    margin-bottom: 16px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent2); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 20px; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #d63a54; }
  .btn-secondary { background: var(--bg3); color: var(--text); }
  .btn-secondary:hover { background: #1a4a7a; }
  .btn-success { background: var(--success); color: #000; }
  .btn-danger { background: var(--danger); color: #000; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-block { width: 100%; }

  /* ===== 主界面 ===== */
  .app { display: none; flex-direction: column; min-height: 100vh; }
  .app.active { display: flex; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar .logo {
    font-size: 18px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .topbar .actions { display: flex; gap: 8px; align-items: center; }

  .tabs {
    display: flex; gap: 4px; padding: 0 24px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 18px; cursor: pointer; font-size: 14px;
    color: var(--text2); border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  .content { flex: 1; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

  /* ===== 文章列表 ===== */
  .post-list { display: flex; flex-direction: column; gap: 8px; }
  .post-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .post-item:hover { border-color: var(--accent2); transform: translateX(4px); }
  .post-item .info { flex: 1; min-width: 0; }
  .post-item .title {
    font-size: 15px; font-weight: 600; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .post-item .meta {
    font-size: 12px; color: var(--text2);
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .post-item .meta span { display: inline-flex; align-items: center; gap: 3px; }
  .tag {
    display: inline-block; padding: 1px 8px;
    background: var(--bg3); border-radius: 10px;
    font-size: 11px; color: var(--accent2);
  }
  .post-item .ops { display: flex; gap: 6px; margin-left: 12px; }

  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text2); font-size: 14px;
  }

  /* ===== 编辑器 ===== */
  .editor { display: none; flex-direction: column; gap: 16px; }
  .editor.active { display: flex; }
  .editor-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .editor-header h2 {
    font-size: 18px; font-weight: 600;
  }
  .editor-header .ops { display: flex; gap: 8px; }

  .frontmatter {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .fm-field { display: flex; flex-direction: column; gap: 4px; }
  .fm-field label {
    font-size: 12px; color: var(--text2); font-weight: 500;
  }
  .fm-field input, .fm-field select, .fm-field textarea {
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .fm-field input:focus, .fm-field textarea:focus { border-color: var(--accent2); }
  .fm-field.full { grid-column: 1 / -1; }
  .fm-field textarea { resize: vertical; min-height: 60px; }

  .editor-body {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .editor-body textarea {
    width: 100%; min-height: 400px;
    padding: 16px;
    background: var(--bg);
    border: none;
    color: var(--text);
    font-size: 14px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    line-height: 1.7;
    outline: none;
    resize: vertical;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; right: 20px;
    padding: 12px 20px; border-radius: 8px;
    font-size: 14px; z-index: 9999;
    animation: slideIn 0.3s ease;
    max-width: 360px;
  }
  .toast.success { background: var(--success); color: #000; }
  .toast.error { background: var(--danger); color: #000; }
  .toast.info { background: var(--accent2); color: #000; }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ===== 模态框 ===== */
  .modal-mask {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-mask.active { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; width: 400px; max-width: 90vw;
  }
  .modal h3 { margin-bottom: 12px; font-size: 16px; }
  .modal p { color: var(--text2); font-size: 13px; margin-bottom: 20px; }
  .modal .ops { display: flex; gap: 8px; justify-content: flex-end; }

  /* ===== 生成日志 ===== */
  .log-box {
    background: #000; color: #4ade80;
    padding: 16px; border-radius: 8px;
    font-family: monospace; font-size: 12px;
    max-height: 300px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  @media (max-width: 768px) {
    .topbar { padding: 10px 14px; }
    .content { padding: 14px; }
    .frontmatter { grid-template-columns: 1fr; }
    .post-item { flex-direction: column; align-items: flex-start; }
    .post-item .ops { margin-left: 0; margin-top: 8px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-wrap" id="loginPage">
  <div class="login-box">
    <h1>Springing 后台</h1>
    <p>轻量博客管理系统</p>
    <input type="password" id="loginPwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div class="app" id="app">
  <div class="topbar">
    <div class="logo">Springing 后台</div>
    <div class="actions">
      <button class="btn btn-success btn-sm" onclick="showNewModal()">+ 新建文章</button>
      <button class="btn btn-secondary btn-sm" onclick="doGenerate()">⚡ 生成静态</button>
      <button class="btn btn-secondary btn-sm" onclick="loadPosts()">🔄 刷新</button>
      <button class="btn btn-danger btn-sm" onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('posts', this)">已发布</div>
    <div class="tab" onclick="switchTab('drafts', this)">草稿箱</div>
  </div>

  <div class="content">
    <!-- 文章列表 -->
    <div id="listView">
      <div class="post-list" id="postList"></div>
    </div>

    <!-- 编辑器 -->
    <div class="editor" id="editorView">
      <div class="editor-header">
        <h2 id="editorTitle">编辑文章</h2>
        <div class="ops">
          <button class="btn btn-secondary btn-sm" onclick="backToList()">← 返回列表</button>
          <button class="btn btn-primary btn-sm" onclick="savePost()">💾 保存</button>
        </div>
      </div>

      <div class="frontmatter">
        <div class="fm-field">
          <label>标题 (title)</label>
          <input type="text" id="fm_title">
        </div>
        <div class="fm-field">
          <label>文件名</label>
          <input type="text" id="fm_filename" placeholder="不含 .md">
        </div>
        <div class="fm-field">
          <label>发布日期 (date)</label>
          <input type="date" id="fm_date">
        </div>
        <div class="fm-field">
          <label>封面 (cover)</label>
          <input type="text" id="fm_cover" placeholder="./img/xxx.jpg">
        </div>
        <div class="fm-field">
          <label>分类 (categories)</label>
          <input type="text" id="fm_categories" placeholder="多个用逗号分隔">
        </div>
        <div class="fm-field">
          <label>标签 (tags)</label>
          <input type="text" id="fm_tags" placeholder="多个用逗号分隔">
        </div>
        <div class="fm-field">
          <label>短链接 (abbrlink)</label>
          <input type="text" id="fm_abbrlink">
        </div>
        <div class="fm-field">
          <label>文章密码 (password)</label>
          <input type="text" id="fm_password" placeholder="留空则不加密">
        </div>
        <div class="fm-field">
          <label>置顶 (top)</label>
          <select id="fm_top">
            <option value="false">否</option>
            <option value="true">是</option>
          </select>
        </div>
        <div class="fm-field">
          <label>数学公式 (mathjax)</label>
          <select id="fm_mathjax">
            <option value="false">否</option>
            <option value="true">是</option>
          </select>
        </div>
        <div class="fm-field full">
          <label>摘要 (description)</label>
          <textarea id="fm_description" placeholder="文章摘要/描述"></textarea>
        </div>
      </div>

      <div class="editor-body">
        <textarea id="postBody" placeholder="在这里写 Markdown 正文..."></textarea>
      </div>
    </div>
  </div>
</div>

<!-- 新建文章模态框 -->
<div class="modal-mask" id="newModal">
  <div class="modal">
    <h3>新建文章</h3>
    <div class="fm-field" style="margin-bottom:12px">
      <label>文章标题</label>
      <input type="text" id="newTitle" placeholder="输入文章标题" onkeydown="if(event.key==='Enter')confirmNew()">
    </div>
    <div class="fm-field" style="margin-bottom:16px">
      <label>保存到</label>
      <select id="newType">
        <option value="posts">已发布</option>
        <option value="drafts">草稿箱</option>
      </select>
    </div>
    <div class="ops">
      <button class="btn btn-secondary btn-sm" onclick="hideNewModal()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="confirmNew()">创建</button>
    </div>
  </div>
</div>

<!-- 生成日志模态框 -->
<div class="modal-mask" id="genModal">
  <div class="modal" style="width:600px">
    <h3>正在生成静态文件...</h3>
    <div class="log-box" id="genLog">等待执行...</div>
    <div class="ops" style="margin-top:12px">
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('genModal').classList.remove('active')">关闭</button>
    </div>
  </div>
</div>

<script>
  let currentTab = 'posts';
  let currentFilename = null;
  let currentType = 'posts';

  // ========== API 封装 ==========
  async function api(url, options = {}) {
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...options,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // ========== Toast ==========
  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  // ========== 登录 ==========
  async function checkAuth() {
    try {
      const data = await api('/api/auth');
      if (data.loggedIn) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('app').classList.add('active');
        loadPosts();
      }
    } catch (e) {}
  }

  async function doLogin() {
    const pwd = document.getElementById('loginPwd').value;
    if (!pwd) return toast('请输入密码', 'error');
    try {
      await api('/api/login', { method: 'POST', body: JSON.stringify({ password: pwd }) });
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('app').classList.add('active');
      loadPosts();
      toast('登录成功', 'success');
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  async function doLogout() {
    try {
      await api('/api/logout', { method: 'POST' });
      location.reload();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  // ========== 文章列表 ==========
  async function loadPosts() {
    try {
      const data = await api(`/api/posts?type=${currentTab}`);
      renderPostList(data.posts);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function renderPostList(posts) {
    const list = document.getElementById('postList');
    if (!posts || posts.length === 0) {
      list.innerHTML = '<div class="empty">还没有文章，点击右上角「新建文章」开始写作</div>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <div class="post-item" onclick="openEditor('${encodeURIComponent(p.filename)}')">
        <div class="info">
          <div class="title">${escapeHtml(p.title)}</div>
          <div class="meta">
            <span>📅 ${p.date || '-'}</span>
            ${p.categories && p.categories.length ? `<span>📁 ${escapeHtml(Array.isArray(p.categories) ? p.categories.join(', ') : p.categories)}</span>` : ''}
            ${p.tags && p.tags.length ? `<span>${(Array.isArray(p.tags) ? p.tags : []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join(' ')}</span>` : ''}
          </div>
        </div>
        <div class="ops" onclick="event.stopPropagation()">
          <button class="btn btn-secondary btn-sm" onclick="openEditor('${encodeURIComponent(p.filename)}')">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deletePost('${encodeURIComponent(p.filename)}')">删除</button>
        </div>
      </div>
    `).join('');
  }

  function switchTab(type, el) {
    currentTab = type;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadPosts();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ========== 编辑器 ==========
  async function openEditor(filenameEncoded) {
    const filename = decodeURIComponent(filenameEncoded);
    currentFilename = filename;
    currentType = currentTab;
    try {
      const post = await api(`/api/post/${filenameEncoded}?type=${currentTab}`);
      document.getElementById('editorTitle').textContent = `编辑: ${post.data.title || filename}`;
      document.getElementById('fm_title').value = post.data.title || '';
      document.getElementById('fm_filename').value = filename.replace('.md', '');
      document.getElementById('fm_date').value = post.data.date || '';
      document.getElementById('fm_cover').value = post.data.cover || '';
      document.getElementById('fm_categories').value = Array.isArray(post.data.categories) ? post.data.categories.join(', ') : (post.data.categories || '');
      document.getElementById('fm_tags').value = Array.isArray(post.data.tags) ? post.data.tags.join(', ') : (post.data.tags || '');
      document.getElementById('fm_abbrlink').value = post.data.abbrlink || '';
      document.getElementById('fm_password').value = post.data.password || '';
      document.getElementById('fm_description').value = post.data.description || '';
      document.getElementById('fm_top').value = post.data.top ? 'true' : 'false';
      document.getElementById('fm_mathjax').value = post.data.mathjax ? 'true' : 'false';
      document.getElementById('postBody').value = post.body || '';

      document.getElementById('listView').style.display = 'none';
      document.getElementById('editorView').classList.add('active');
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function backToList() {
    document.getElementById('editorView').classList.remove('active');
    document.getElementById('listView').style.display = 'block';
    currentFilename = null;
    loadPosts();
  }

  async function savePost() {
    const title = document.getElementById('fm_title').value.trim();
    if (!title) return toast('标题不能为空', 'error');

    const filename = document.getElementById('fm_filename').value.trim() || title;
    const categoriesStr = document.getElementById('fm_categories').value.trim();
    const tagsStr = document.getElementById('fm_tags').value.trim();

    const data = {
      title,
      date: document.getElementById('fm_date').value || new Date().toISOString().slice(0, 10),
      cover: document.getElementById('fm_cover').value.trim(),
      categories: categoriesStr ? categoriesStr.split(',').map(s => s.trim()).filter(Boolean) : [],
      tags: tagsStr ? tagsStr.split(',').map(s => s.trim()).filter(Boolean) : [],
      abbrlink: document.getElementById('fm_abbrlink').value.trim(),
      password: document.getElementById('fm_password').value.trim(),
      description: document.getElementById('fm_description').value.trim(),
      top: document.getElementById('fm_top').value === 'true',
      mathjax: document.getElementById('fm_mathjax').value === 'true',
    };

    const body = document.getElementById('postBody').value;

    try {
      if (currentFilename) {
        await api(`/api/post/${encodeURIComponent(currentFilename)}`, {
          method: 'PUT',
          body: JSON.stringify({ filename: filename + '.md', data, body, type: currentType }),
        });
        toast('保存成功', 'success');
      }
      backToList();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  async function deletePost(filenameEncoded) {
    const filename = decodeURIComponent(filenameEncoded);
    if (!confirm(`确定要删除「${filename}」吗？此操作不可恢复。`)) return;
    try {
      await api(`/api/post/${filenameEncoded}?type=${currentTab}`, { method: 'DELETE' });
      toast('已删除', 'success');
      loadPosts();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  // ========== 新建文章 ==========
  function showNewModal() {
    document.getElementById('newTitle').value = '';
    document.getElementById('newType').value = currentTab;
    document.getElementById('newModal').classList.add('active');
    setTimeout(() => document.getElementById('newTitle').focus(), 100);
  }

  function hideNewModal() {
    document.getElementById('newModal').classList.remove('active');
  }

  async function confirmNew() {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) return toast('请输入标题', 'error');
    const type = document.getElementById('newType').value;
    try {
      const res = await api('/api/post', {
        method: 'POST',
        body: JSON.stringify({
          filename: title + '.md',
          type,
          data: { title },
          body: '',
        }),
      });
      hideNewModal();
      toast('创建成功', 'success');
      // 切换到对应标签并打开编辑器
      if (type !== currentTab) {
        document.querySelectorAll('.tab').forEach((t, i) => {
          if ((type === 'posts' && i === 0) || (type === 'drafts' && i === 1)) {
            t.click();
          }
        });
      }
      setTimeout(() => openEditor(encodeURIComponent(res.filename)), 200);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  // ========== 生成静态文件 ==========
  async function doGenerate() {
    const modal = document.getElementById('genModal');
    const log = document.getElementById('genLog');
    modal.classList.add('active');
    log.textContent = '正在执行 hexo generate，请稍候...';
    try {
      const res = await api('/api/generate', { method: 'POST' });
      log.textContent = res.stdout || '生成完成！';
      toast('静态文件生成成功', 'success');
    } catch (e) {
      log.textContent = `错误: ${e.message}\n${e.stdout || ''}\n${e.stderr || ''}`;
      toast('生成失败', 'error');
    }
  }

  // ========== 初始化 ==========
  checkAuth();
</script>
</body>
</html>
